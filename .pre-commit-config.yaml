# Keeps README.md's "Skills by plugin" block in sync with the source of truth before
# each commit. Enable once per clone with:  pre-commit install
#
# This hook is OFFLINE — it regenerates the block from marketplace.json and the local
# SKILL.md files. It does NOT hit the network.
repos:
  - repo: local
    hooks:
      - id: gen-skills-readme
        name: Regenerate README skills block
        entry: bash scripts/gen-skills-readme.sh
        language: system
        pass_filenames: false
        files: '^(plugins/.*/SKILL\.md|\.claude-plugin/marketplace\.json|scripts/gen-skills-readme\.sh)$'
