# Keeps README.md's "Skills by plugin" block in sync with the source of truth, and
# runs hoopit-board's, skill-eval's and field-report's tests whenever a script or its tests change,
# before each commit. Enable once per clone with:  pre-commit install
#
# Every hook is OFFLINE: the README block is regenerated from marketplace.json and the
# local SKILL.md files, and the tests stub every network call and every model.
repos:
  - repo: local
    hooks:
      - id: gen-skills-readme
        name: Regenerate README skills block
        entry: bash scripts/gen-skills-readme.sh
        language: system
        pass_filenames: false
        files: '^(plugins/.*/SKILL\.md|\.claude-plugin/marketplace\.json|scripts/gen-skills-readme\.sh)$'
      - id: test-hoopit-board
        name: Test hoopit-board
        entry: python3 -B plugins/github-tracker/tests/test_hoopit_board.py
        language: system
        pass_filenames: false
        files: '^(plugins/github-tracker/(bin|tests)/|personal/dispatch-ladder/ladder\.json$)'
      - id: test-skill-eval
        name: Test skill-eval
        entry: python3 -B plugins/dev/tests/test_skill_eval.py
        language: system
        pass_filenames: false
        files: '^plugins/dev/(skills/skill-eval/scripts/|tests/test_skill_eval\.py$)'
      - id: test-field-report
        name: Test field-report
        entry: python3 -B plugins/dev/tests/test_field_report.py
        language: system
        pass_filenames: false
        files: '^plugins/dev/(skills/skill-eval/scripts/field-report|tests/test_field_report\.py)$'
