name: Refresh matt-picks lockfile

# Re-fetches the matt-picks frontmatter (descriptions + model-invocation status) from
# upstream into matt-picks-lock.json, and VERIFIES every pick still exists upstream.
# `--refresh` exits non-zero if any pick was renamed/removed upstream, so a red run
# here means the skills[] list in marketplace.json has drifted and needs fixing.
# When descriptions change, it commits the refreshed lockfile + regenerated README.

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

# Share the README-writer's concurrency group so a refresh commit can't race the
# push-triggered regen workflow.
concurrency:
  group: gen-skills-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh from upstream (fails if a pick no longer exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gen-skills-readme.sh --refresh

      - name: Commit if it changed
        run: |
          if git diff --quiet -- matt-picks-lock.json README.md; then
            echo "matt-picks already in sync — nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add matt-picks-lock.json README.md
          git commit -m 'chore: refresh matt-picks lockfile from upstream [skip ci]'
          git pull --rebase origin main   # land on top of any concurrent push
          git push origin HEAD:main
